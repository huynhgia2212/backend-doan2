name: Tự động Build và Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Lấy mã nguồn về
        uses: actions/checkout@v4

      # BƯỚC MỚI: Đăng nhập vào Docker Hub bằng chìa khóa đã giấu
      - name: Đăng nhập vào Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Thiết lập môi trường Docker
        uses: docker/setup-buildx-action@v3

      # SỬA LẠI: Chuyển push thành true và đặt tên image có chứa Username
      - name: Tiến hành Build và Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/backend-doan2:latest